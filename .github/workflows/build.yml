name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build optimised APK and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease testReleaseUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kairos-apk
          path: app/build/outputs/apk/release/*.apk

  release:
    # Offline releases: publishes v<versionName> with the APK when main gets a version not yet released.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Check for an existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.name }}" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.exists == 'false'
        with:
          name: kairos-apk
          path: apk
      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.name }}"
          mv apk/*.apk "Kairos-$V.apk"
          gh release create "v$V" "Kairos-$V.apk" --target "$GITHUB_SHA" \
            --title "Kairos $V (offline)" --generate-notes
