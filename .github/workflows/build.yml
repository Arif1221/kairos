name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # for attaching the online APK to tagged releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both flavors and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew assemblePlayRelease assembleOnlineRelease testPlayReleaseUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kairos-play-apk
          path: app/build/outputs/apk/play/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kairos-online-apk
          path: app/build/outputs/apk/online/release/*.apk
      # A release is published when a "v1.2.3" tag is pushed, or when main gets a commit whose
      # versionName has no release yet (so bumping versionName on main is enough to release).
      - name: Decide whether to release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
            if ! gh release view "v$ver" >/dev/null 2>&1; then echo "tag=v$ver" >> "$GITHUB_OUTPUT"; fi
          fi
      - name: Publish APKs to GitHub Releases
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            **Which APK?**
            - `app-online-release.apk`: Kairos Online. Your music plus YouTube Music and YouTube (audio only). Installs next to Kairos.
            - `app-play-release.apk`: Kairos. Offline only, the same build that goes to the Play Store.
          files: |
            app/build/outputs/apk/online/release/*.apk
            app/build/outputs/apk/play/release/*.apk
