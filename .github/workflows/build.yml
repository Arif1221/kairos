name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Load the signing key
        # Secrets are not available to pull requests from forks; those builds use the debug key.
        env:
          KEYSTORE_B64: ${{ secrets.KAIROS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kairos.jks"
            echo "KAIROS_KEYSTORE=$RUNNER_TEMP/kairos.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secrets; building with the debug key."
          fi
      - name: Build APK and Play bundle, run unit tests
        env:
          KAIROS_KEYSTORE_PASSWORD: ${{ secrets.KAIROS_KEYSTORE_PASSWORD }}
          KAIROS_KEY_ALIAS: ${{ secrets.KAIROS_KEY_ALIAS }}
          KAIROS_KEY_PASSWORD: ${{ secrets.KAIROS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease testReleaseUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kairos-apk
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kairos-aab
          path: app/build/outputs/bundle/release/*.aab

  release:
    # Offline releases: publishes v<versionName> with the APK when main gets a version not yet
    # released. Only builds signed with the real key are published.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Check for an existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.KAIROS_KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then echo "::warning::Not publishing: add the signing key secrets first."; echo "exists=true" >> "$GITHUB_OUTPUT"
          elif gh release view "v${{ steps.v.outputs.name }}" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.exists == 'false'
        with:
          name: kairos-apk
          path: apk
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.exists == 'false'
        with:
          name: kairos-aab
          path: aab
      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.name }}"
          mv apk/*.apk "Kairos-$V.apk"
          mv aab/*.aab "Kairos-$V.aab"
          gh release create "v$V" "Kairos-$V.apk" "Kairos-$V.aab" --target "$GITHUB_SHA" \
            --title "Kairos $V (offline)" --generate-notes
