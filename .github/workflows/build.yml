name: Build Kairos Online

# This file lives on the "online" branch. main keeps its own offline workflow.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write # to publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the online APK and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew assembleOnlineRelease testOnlineReleaseUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kairos-online-apk
          path: app/build/outputs/apk/online/release/*.apk
      # A push to "online" whose versionName has no release yet publishes v<version>-online.
      - name: Decide whether to release
        id: rel
        if: github.ref == 'refs/heads/online'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          tag="v$ver-online"
          if ! gh release view "$tag" >/dev/null 2>&1; then echo "tag=$tag" >> "$GITHUB_OUTPUT"; fi
      - name: Publish Kairos Online to GitHub Releases
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Kairos Online ${{ steps.rel.outputs.tag }}
          generate_release_notes: true
          body: |
            Kairos Online: the offline Kairos app plus YouTube Music and YouTube (audio only).
            Installs next to offline Kairos (package `com.skarif.kairos.online`).
          files: app/build/outputs/apk/online/release/*.apk
