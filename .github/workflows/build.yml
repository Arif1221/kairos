name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # for attaching the online APK to tagged releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both flavors and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew assemblePlayRelease assembleOnlineRelease testPlayReleaseUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kairos-play-apk
          path: app/build/outputs/apk/play/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kairos-online-apk
          path: app/build/outputs/apk/online/release/*.apk
      # Tag a commit "v1.2.3" to publish both APKs as a GitHub Release.
      - name: Publish APKs to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            **Which APK?**
            - `app-online-release.apk`: Kairos Online. Your music plus YouTube Music and YouTube (audio only). Installs next to Kairos.
            - `app-play-release.apk`: Kairos. Offline only, the same build that goes to the Play Store.
          files: |
            app/build/outputs/apk/online/release/*.apk
            app/build/outputs/apk/play/release/*.apk
